# Full containerized stack (mongo, redis, api, worker, web) for local testing
# of the same images you'd ship to a cloud platform.
#
#   docker compose up --build
#   Frontend: http://localhost:3000   API: http://localhost:4000
#
# This is separate from infra/docker-compose.yml, which only starts the local
# dev dependencies (mongo/redis/localstack) for `pnpm dev` running on the host.
#
# Secrets (JWT_SECRET, OPENAI_API_KEY, etc.) are read from apps/api/.env at
# container start — that file is gitignored and never baked into the image.

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    env_file:
      - apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/visora
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
      # Chromium isn't installed in this image — see apps/api/Dockerfile.
      ENABLE_PLAYWRIGHT: "false"
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    command: ["node", "dist/worker.js"]
    env_file:
      - apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/visora
      REDIS_URL: redis://redis:6379
      ENABLE_PLAYWRIGHT: "false"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    init: true
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
